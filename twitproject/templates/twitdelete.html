<!DOCTYPE html>
<html>
<head>
    <title>Delete Tweet</title>
</head>
<body>

<h2>Delete Tweet</h2>

<p>Are you sure you want to delete this tweet?</p>

<p>{{ tweet.content }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'twitlist' %}">Cancel</a>

</body>
</html>
