{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body>

<div class="profile-container">

    <!-- Profile Card -->
    <div class="profile-card">
        <div class="profile-image">
            <img src="{{ user.profile.image.url }}" alt="Profile">
        </div>

        <div class="profile-info">
            <h2>{{ user.username }}</h2>
            <p class="email">{{ user.email }}</p>

            <div class="stats">
                <div>
                    <strong>{{ tweets|length }}</strong>
                    <span>Posts</span>
                </div>
            </div>

            <a href="{% url 'edit_profile' %}" class="btn">Edit Profile</a>
        </div>
    </div>

    <!-- Tweets -->
    <div class="tweets-list">
        {% for tweet in tweets %}
            <div class="tweet">
                <p>{{ tweet.content }}</p>

                {% if tweet.photo %}
                    <img src="{{ tweet.photo.url }}" class="tweet-img">
                {% endif %}

                <span>{{ tweet.created_at|date:"M d, Y H:i" }}</span>
            </div>
        {% empty %}
            <p class="empty">No tweets yet.</p>
        {% endfor %}
    </div>

</div>

</body>
</html>
